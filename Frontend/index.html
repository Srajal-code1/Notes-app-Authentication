<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>  
    </head>
    <body>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px;">
            <div id="notes">
                Loading...
            </div>

            <div>
                <input type="text" id="userNote" />
                <button onclick="addTodo()">Create new note</button>
            </div>
        </div>
        <script>

            async function addTodo() {
                await axios.post("http://localhost:3000/notes", {
                    note: document.getElementById("userNote").value
                }, {
                    headers: {
                        token: localStorage.getItem("token")
                    }
                })
                

                // show the note in the frontend
                const noteNode = document.createElement("div");
                noteNode.innerHTML = document.getElementById("userNote").value;
                noteNode.setAttribute("style", "border: 2px solid black; padding: 10px; margin: 10px; border-radius: 5px;");
                document.getElementById("notes").appendChild(noteNode);




                document.getElementById("userNote").value = "";
            }

            async function getTodos() {
                // const response = await fetch("http://localhost:3000/notes");
                // const json = await response.json();
                // console.log(json.notes);

                //second way --> axios
                const response = await axios.get("http://localhost:3000/notes", {
                    headers: {
                        token: localStorage.getItem("token")
                    }
                });
                const notes = response.data.notes;
                
                console.log(response.data.notes);
                document.getElementById("notes").innerHTML = "";
                for(let i=0; i<notes.length; i++) {
                    const noteNote = document.createElement("div");
                    noteNote.innerHTML = notes[i].note;
                    noteNote.setAttribute("style", "border: 2px solid black; padding: 10px; margin: 10px; border-radius: 5px;");
                    document.getElementById("notes").appendChild(noteNote);
                }
            }
            getTodos();
        </script>
        
    </body>
</html>
